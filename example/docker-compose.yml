
services:
  vgw:
    image: ghcr.io/versity/versitygw:latest
    ports:
      - "${VGW_HOST_PORT:-4566}:4566"
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARGS: /tmp/vgw-data
      VGW_PORT: ":4566"
      VGW_IAM_DIR: /tmp/vgw-iam
      ROOT_ACCESS_KEY: dummy
      ROOT_SECRET_KEY: dummy
    volumes:
      - ./data:/tmp/vgw-data
      - vgw-iam:/tmp/vgw-iam
  caddy:
    image: caddy
    depends_on:
      - vgw
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_REGION: us-east-1
    volumes:
      - ./Caddyfile:/Caddyfile:ro
    ports:
      - "${CADDY_HOST_PORT:-80}:80"
    command: caddy run --config /Caddyfile

volumes:
  vgw-iam:
